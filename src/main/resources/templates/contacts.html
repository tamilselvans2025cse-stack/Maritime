<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Contacts')}"></head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>
<main>
    <h1>Contacts</h1>
    <table>
        <thead><tr><th>Name</th><th>Type</th><th>Email</th><th>Phone</th><th>Address</th></tr></thead>
        <tbody>
        <tr th:each="c : ${contacts}">
            <td th:text="${c.name}">-</td>
            <td><span class="badge" th:text="${c.contactType}">-</span></td>
            <td th:text="${c.email}">-</td>
            <td th:text="${c.phone}">-</td>
            <td th:text="${c.address}">-</td>
        </tr>
        </tbody>
    </table>

    <h2>Add Contact</h2>
    <form th:action="@{/contacts}" method="post" class="form-grid">
        <input type="text" name="name" placeholder="Name" required/>
        <select name="contactType" required>
            <option value="CUSTOMER">Customer</option>
            <option value="VENDOR">Vendor</option>
        </select>
        <input type="email" name="email" placeholder="Email"/>
        <input type="text" name="phone" placeholder="Phone"/>
        <input type="text" name="address" placeholder="Address"/>
        <button type="submit" class="btn">Add Contact</button>
    </form>
</main>
</body>
</html>
