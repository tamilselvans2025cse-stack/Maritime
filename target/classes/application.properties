# Default local database is H2 so the project runs without an external MySQL installation.
# If you want MySQL instead, switch to the commented URL below and set your username/password.
spring.datasource.url=jdbc:h2:mem:maritime_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ddl-auto=update lets Hibernate create/update tables automatically from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

server.port=8080

# Electricity rate used for shore-power billing (Rs per kWh)
maritime.shorepower.rate-per-kwh=12

