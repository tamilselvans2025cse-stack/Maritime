<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Products')}"></head>
<body>
<div th:replace="~{fragments :: sidebar}"></div>
<main>
    <h1>Products</h1>
    <table>
        <thead><tr><th>Code</th><th>Name</th><th>Type</th><th>Unit Price</th><th>Description</th></tr></thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.productCode}">-</td>
            <td th:text="${p.productName}">-</td>
            <td><span class="badge" th:text="${p.productType}">-</span></td>
            <td th:text="'₹' + ${p.unitPrice}">-</td>
            <td th:text="${p.description}">-</td>
        </tr>
        </tbody>
    </table>

    <h2>Add Product</h2>
    <form th:action="@{/products}" method="post" class="form-grid">
        <input type="text" name="productCode" placeholder="Product Code" required/>
        <input type="text" name="productName" placeholder="Product Name" required/>
        <select name="productType" required>
            <option value="SERVICE">Service</option>
            <option value="GOODS">Goods</option>
        </select>
        <input type="number" step="0.01" name="unitPrice" placeholder="Unit Price" required/>
        <input type="text" name="description" placeholder="Description"/>
        <button type="submit" class="btn">Add Product</button>
    </form>
</main>
</body>
</html>
